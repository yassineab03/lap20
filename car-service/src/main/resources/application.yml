services:
  clients:
    url: ${CLIENT_SERVICE_URL:http://localhost:8888/SERVICE-CLIENT/api/client}

server:
  port: 8082

spring:
  application:
    name: SERVICE-CAR
  datasource:
    url: jdbc:h2:file:./carservicedb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
